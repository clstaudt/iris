name: Pack Electron App

on:
  # Main is built once a week (Sundays), when it has changed since the last build, and
  # by hand; not on every push: macOS minutes count ten times
  schedule:
    - cron: "0 3 * * 0"
  push:
    tags:
      - "v*"
  # A pull request that changes how the app is built builds it too, as main
  # is built (signed ad hoc, not notarized), and smoke tests the core in it;
  # it uploads nothing. Other pull requests do not: macOS minutes count ten
  # times, and the unit tests find an import the bundle lacks on Linux
  # (tests/unit/test_bundle_imports.py). By hand, any branch can be built
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - "ui/package.json"
      - "ui/package-lock.json"
      - "ui/electron/**"
      - "ui/electron-builder*"
      - "ui/build/**"
      - "ui/scripts/package-mac.sh"
      - ".github/workflows/pack-electron.yml"
  workflow_dispatch:
    inputs:
      keep:
        description: "Keep the disk image as an artifact of the run (three days)"
        type: boolean
        default: false

permissions:
  contents: write

# One build of a ref at a time: builds of main pushed close together each
# replace the assets of the rolling "latest" pre-release, and two doing so
# at once fail on each other's deleted assets. A later push waits for the
# one running, and none is cancelled
concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A scheduled build runs only when main has moved since the commit the
  # latest pre-release was built from; the check runs on Linux, so an
  # unchanged day costs no macOS minutes
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != schedule ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        built=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/tags/latest | cut -f1)
        if [ "$built" = "$GITHUB_SHA" ]; then echo "build=false" >> "$GITHUB_OUTPUT"; else echo "build=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    # Apple Silicon only: the core needs MLX. Pinned to macos-15 (not
    # macos-latest): on macOS 26.6 the `security set-key-partition-list`
    # command started verifying its -k argument, and electron-builder passes
    # the .p12 password there instead of the keychain password, so signing
    # fails. Stopgap until we manage the signing keychain ourselves.
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v6

    # Python core: package-mac.sh freezes it from a build environment of its
    # own, on uv's standalone Python and the locked dependencies, and checks
    # that every engine imports inside the bundle
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    # Electron app
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"
    - name: Install Electron dependencies
      run: npm ci
      working-directory: ui

    - name: Package the app (signed and notarized)
      if: startsWith(github.ref, 'refs/tags/')
      run: npm run dist:mac
      working-directory: ui
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    # main, pull requests and manual runs: no certificate, no notarization
    - name: Package the app (signed ad hoc)
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: npm run dist:mac
      working-directory: ui
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: "false"

    # The core in the app, signed, started as the app starts it: it must
    # answer the app's first requests and find every engine, before the disk
    # image goes anywhere. Offline, in an empty home, with no models
    - name: Smoke test the core in the app
      timeout-minutes: 15
      run: uv run --no-project --python 3.13 packaging/smoke_core.py ui/release/mac-arm64/Iris.app

    # A tag's disk image goes straight to its release (a draft is made if
    # there is none): release assets do not count against the account's
    # artifact storage, which a disk image of this size fills
    - name: Upload the disk image to the release
      if: startsWith(github.ref, 'refs/tags/')
      working-directory: ui
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${GITHUB_REF#refs/tags/}"
        gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Iris $tag" --generate-notes --draft
        for f in release/*.dmg; do
          echo "Uploading: $f"
          gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY" --clobber
        done

    # Each build of main (daily, or by hand) replaces the disk image of the rolling "latest"
    # pre-release, whose tag moves to the commit built. Release files do not
    # expire and do not count against Actions storage; it stays a
    # pre-release, so a version's release remains the latest release
    - name: Update the latest pre-release
      if: github.ref == 'refs/heads/main'
      working-directory: ui
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git tag -f latest "$GITHUB_SHA"
        git push -f origin refs/tags/latest
        notes="The app built from main at ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)), signed ad hoc and not notarized."
        if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release edit latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --notes "$notes"
        else
          gh release create latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "Iris (latest build of main)" --notes "$notes"
        fi
        # The new disk image goes up first, so there always is one to
        # download; its name holds the version, and earlier ones go after
        gh release upload latest release/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
        keep=$(basename release/*.dmg)
        for asset in $(gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
          [ "$asset" = "$keep" ] || gh release delete-asset latest "$asset" --repo "$GITHUB_REPOSITORY" --yes
        done

    # A manual run on another branch can keep its disk image for three days;
    # a full storage quota does not fail the build
    - uses: actions/upload-artifact@v7
      if: github.event_name == 'workflow_dispatch' && inputs.keep
      continue-on-error: true
      with:
        name: Iris-${{ github.sha }}-macos-arm64
        path: ui/release/*.dmg
        retention-days: 3
