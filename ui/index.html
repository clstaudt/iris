<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iris</title>
    <style>
      html,
      body {
        background: #121316;
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* Presence: a transparent window, only the orb shows */
      html.presence-window,
      html.presence-window body {
        background: transparent;
      }
    </style>
    <script>
      if (new URLSearchParams(location.search).get("window") === "presence") {
        document.documentElement.classList.add("presence-window");
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
