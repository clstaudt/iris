[project]
name = "iris"
version = "0.1.0"
description = "Voice assistant with speech-to-text, LLM, and text-to-speech"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.0.0",
    # GPU speech recognition on Apple Silicon; elsewhere faster-whisper is used
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "kokoro-onnx>=0.3.6",
    "ollama>=0.1.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "rich>=13.0.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.11.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "mss>=9.0.0",
    "ddgs>=7.0.0",
    "trafilatura>=2.0.0",
    # Echo cancellation (WebRTC AEC3), so Iris can be interrupted by voice
    "livekit>=1.1.20",
    "pypdf>=6.19.0",
]

[project.scripts]
iris = "iris.cli:main"
iris-benchmark = "irisdev.benchmark:main"
iris-gui = "iris.rpc_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pandas>=2.0.0",
    "typer>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: tests requiring external services (ollama, kokoro, whisper)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

