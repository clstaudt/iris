name: Pack Electron App

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

# The workflow builds and checks the app; it uploads nothing
permissions:
  contents: read

jobs:
  build:
    # Apple Silicon only: the core needs MLX. Pinned to macos-15 (not
    # macos-latest): on macOS 26.6 the `security set-key-partition-list`
    # command started verifying its -k argument, and electron-builder passes
    # the .p12 password there instead of the keychain password, so signing
    # fails. Stopgap until we manage the signing keychain ourselves.
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v6

    # Python core: package-mac.sh freezes it from a build environment of its
    # own, on uv's standalone Python and the locked dependencies, and checks
    # that every engine imports inside the bundle
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    # Electron app
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"
    - name: Install Electron dependencies
      run: npm ci
      working-directory: ui

    - name: Package the app (signed and notarized)
      if: startsWith(github.ref, 'refs/tags/')
      run: npm run dist:mac
      working-directory: ui
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - name: Package the app (signed ad hoc)
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: npm run dist:mac
      working-directory: ui
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: "false"
