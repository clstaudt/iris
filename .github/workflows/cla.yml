# Asks every contributor to sign the Contributor License Agreement (CLA.md)
# on their first pull request, with CLA Assistant Lite. They sign by
# commenting the sentence it asks for; it keeps the signatures in the
# cla-signatures branch and sets the pull request's "CLA" check. The
# maintainer and bots need no signature. A short Linux job per event.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        # v2.6.1, pinned to its commit: it runs with write access on pull
        # requests from forks
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: clstaudt,*[bot]
