name: Pack Electron App

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      keep:
        description: "Keep the disk image as an artifact of the run (one day)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon only: the core needs MLX. Pinned to macos-15 (not
    # macos-latest): on macOS 26.6 the `security set-key-partition-list`
    # command started verifying its -k argument, and electron-builder passes
    # the .p12 password there instead of the keychain password, so signing
    # fails. Stopgap until we manage the signing keychain ourselves.
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v6

    # Python core: package-mac.sh freezes it from a build environment of its
    # own, on uv's standalone Python and the locked dependencies, and checks
    # that every engine imports inside the bundle
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    # Electron app
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"
    - name: Install Electron dependencies
      run: npm ci
      working-directory: ui

    - name: Package the app (signed and notarized)
      if: startsWith(github.ref, 'refs/tags/')
      run: npm run dist:mac
      working-directory: ui
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - name: Package the app (signed ad hoc)
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: npm run dist:mac
      working-directory: ui
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: "false"

    # A tag's disk image goes straight to its release (a draft is made if
    # there is none): release assets do not count against the account's
    # artifact storage, which a disk image of this size fills
    - name: Upload the disk image to the release
      if: startsWith(github.ref, 'refs/tags/')
      working-directory: ui
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${GITHUB_REF#refs/tags/}"
        gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Iris $tag" --generate-notes --draft
        for f in release/*.dmg; do
          echo "Uploading: $f"
          gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY" --clobber
        done

    # Other builds only check that the app builds. A manual run can keep the
    # disk image for a day; a full storage quota then does not fail the build
    - uses: actions/upload-artifact@v7
      if: github.event_name == 'workflow_dispatch' && inputs.keep
      continue-on-error: true
      with:
        name: Iris-${{ github.ref_name }}-macos-arm64
        path: ui/release/*.dmg
        retention-days: 1
