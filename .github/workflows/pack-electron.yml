name: Pack Electron App

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon only: the core needs MLX. Pinned to macos-15 (not
    # macos-latest): on macOS 26.6 the `security set-key-partition-list`
    # command started verifying its -k argument, and electron-builder passes
    # the .p12 password there instead of the keychain password, so signing
    # fails. Stopgap until we manage the signing keychain ourselves.
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v6

    # Python core: package-mac.sh freezes it from a build environment of its
    # own, on uv's standalone Python and the locked dependencies, and checks
    # that every engine imports inside the bundle
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    # Electron app
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"
    - name: Install Electron dependencies
      run: npm ci
      working-directory: ui

    - name: Package the app (signed and notarized)
      if: startsWith(github.ref, 'refs/tags/')
      run: npm run dist:mac
      working-directory: ui
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - name: Package the app (signed ad hoc)
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: npm run dist:mac
      working-directory: ui
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: "false"

    - uses: actions/upload-artifact@v7
      with:
        name: Iris-${{ github.ref_name }}-macos-arm64
        path: ui/release/*.dmg

  # Upload the disk image to the tag's GitHub release (a draft is made if
  # there is none yet) only after the build succeeded
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download the artifact
      uses: actions/download-artifact@v7
      with:
        path: artifacts/
    - name: Upload release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${GITHUB_REF#refs/tags/}"
        gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Iris $tag" --generate-notes --draft
        shopt -s globstar nullglob
        for f in artifacts/**/*.dmg; do
          echo "Uploading: $f"
          gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY" --clobber
        done
